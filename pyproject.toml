[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-docs-toolkit"
version = "0.1.0"
description = "Config-agnostic themed Markdown docs browser core (shared by wm, and later tt/sb)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "rich>=13.7.0",
    "inquirerpy>=0.3.4",
]

[project.scripts]
md-docs = "md_docs.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-Pygments>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md_docs"]
artifacts = ["src/md_docs/themes/builtin/*.toml"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["InquirerPy.*"]
ignore_missing_imports = true
